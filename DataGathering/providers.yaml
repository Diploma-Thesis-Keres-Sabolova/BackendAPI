providers:
  - name: OilPriceAPI
    endpoint: "https://api.oilpriceapi.com/v1/prices/latest"
    timestamp_pth: "data.prices.created_at"
    data_pth: "data.prices"
    units_pth: ""
    value_key_pth: "data.prices.code"
    file_format: "json"
    params:
      by_code: "WTI_USD,BRENT_CRUDE_USD"
      fields: "name,price,currency,unit,timestamp"
    auth:
      type: authorization
      prefix: "Token"
      api_key_env: "OILPRICE_API_KEY"
    description: "Fetches latest oil prices (WTI, Brent, etc.)"

  - name: OKTE_DAM
    endpoint: "https://isot.okte.sk/api/v1/dam/results"
    timestamp_pth: "deliveryStart"
    data_pth: ""
    units_pth: null
    value_key_pth: null
    file_format: "json"
    params:
      deliveryDayFrom: "{{today}}"
      deliveryDayTo: "{{today}}"
    description: "OKTE provider"

  - name: OpenMeteo_Forecast
    endpoint: "https://api.open-meteo.com/v1/forecast"
    timestamp_pth: "minutely_15.time"
    data_pth: "minutely_15"
    units_pth: "minutely_15_units"
    value_key_pth: null
    file_format: "json"
    params:
      latitude: 48.15
      longitude: 17.11
      minutely_15: "temperature_2m,rain,snowfall,wind_speed_10m,dew_point_2m,precipitation"
    description: "OpenMeteo Forecast data"

  - name: OpenMeteo_History
    endpoint: "https://archive-api.open-meteo.com/v1/archive"
    timestamp_pth: "hourly.time"
    data_pth: "hourly"
    units_pth: "hourly_units"
    value_key_pth: null
    file_format: "json"
    params:
      latitude: 48.15
      longitude: 17.11
      start_date: "{{today}}"
      end_date: "{{today}}"
      hourly: "temperature_2m,dew_point_2m,rain,snowfall,wind_speed_10m,precipitation"
    description: "OpenMeteo Hist data"

  - name: EnergyCharts_SkSolar
    endpoint: "https://api.energy-charts.info/public_power_forecast"
    timestamp_pth: "unix_seconds"
    data_pth: "forecast_values"
    units_pth: null
    value_key_pth: null
    file_format: "json"
    params:
      country: "sk"
      production_type: "solar"
      forecast_type: "day-ahead"
    description: "Energy Charts forecast SK (Solar)"

  - name: EnergyCharts_AtWindOnshore
    endpoint: "https://api.energy-charts.info/public_power_forecast"
    timestamp_pth: "unix_seconds"
    data_pth: "forecast_values"
    units_pth: null
    value_key_pth: null
    file_format: "json"
    params:
      country: "at"
      production_type: "wind_onshore"
      forecast_type: "day-ahead"
    description: "Energy Charts forecast AT (Wind Onshore)"

  - name: EnergyCharts_DeWindOnshore
    endpoint: "https://api.energy-charts.info/public_power_forecast"
    timestamp_pth: "unix_seconds"
    data_pth: "forecast_values"
    units_pth: null
    value_key_pth: null
    file_format: "json"
    params:
      country: "de"
      production_type: "wind_onshore"
      forecast_type: "day-ahead"
    description: "Energy Charts forecast DE (Wind Onshore)"