
services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_NAME}_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ${CONTAINER_NAME}_fastapi
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - app-network

  data_gathering:
    build:
      context: .
      dockerfile: DataGathering/Dockerfile
    container_name: ${CONTAINER_NAME}_data
    restart: "no"
    env_file:
      - .env
    depends_on:
      - fastapi
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
