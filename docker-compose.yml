
services:
  db:
    image: postgres:18-alpine
    container_name: ${CONTAINER_NAME}_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ${CONTAINER_NAME}_fastapi
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network

    cpus: "1.0"
    mem_limit: 512m

    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; r = urllib.request.urlopen(\"http://localhost:8000/health/\"); exit(0 if r.status==200 else 1)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  data_gathering:
    build:
      context: .
      dockerfile: DataGathering/Dockerfile
    container_name: ${CONTAINER_NAME}_data
    restart: "on-failure"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    environment:
      LOG_LEVEL: INFO
      LOG_DIR: /app/logs
    depends_on:
      - fastapi
      - rabbitmq
    networks:
      - app-network

  pushgateway:
    image: prom/pushgateway:latest
    container_name: ${CONTAINER_NAME}_pushgateway
    restart: always
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: ${CONTAINER_NAME}_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_HTTP_PORT: 3000
      GF_LOG_LEVEL: debug
    container_name: ${CONTAINER_NAME}_grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: ./nginx
    container_name: backend_api_nginx
    ports:
      - "127.0.0.1:10443:10443"
    depends_on:
      - fastapi
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network
    healthcheck:
      test: >
        sh -c "
          curl -f http://fastapi:8000/health/ &&
          curl -f -L http://grafana:3000/grafana/ || exit 1
        "
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${CONTAINER_NAME}_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_MANAGEMENT_PATH_PREFIX=/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: DataGathering/Dockerfile
    container_name: ${CONTAINER_NAME}_worker
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      fastapi:
        condition: service_started
    environment:
      - PYTHONPATH=/app
    networks:
      - app-network
    command: [ "python", "/app/DataGathering/worker.py" ]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${CONTAINER_NAME}_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9100/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: ${CONTAINER_NAME}_cadvisor
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_API_VERSION=1.41
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:2.9.2
    container_name: ${CONTAINER_NAME}_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    container_name: ${CONTAINER_NAME}_promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
    environment:
      - DOCKER_API_VERSION=1.44
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - app-network
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1s bash -c '</dev/tcp/localhost/9080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: ${CONTAINER_NAME}_rabbitmq_exporter
    restart: unless-stopped
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=${RABBITMQ_USER}
      - RABBIT_PASSWORD=${RABBITMQ_PASSWORD}
      - PUBLISH_PORT=9419
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: ${CONTAINER_NAME}_db_backup
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - app-network

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  loki_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
