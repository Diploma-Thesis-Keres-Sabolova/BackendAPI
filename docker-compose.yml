
services:
  db:
    image: postgres:15
    container_name: ${CONTAINER_NAME}_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ${CONTAINER_NAME}_fastapi
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - app-network

    cpus: "1.0"
    mem_limit: 512m

    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import urllib.request; r = urllib.request.urlopen(\"http://localhost:8000/health/\"); exit(0 if r.status==200 else 1)'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  data_gathering:
    build:
      context: .
      dockerfile: DataGathering/Dockerfile
    container_name: ${CONTAINER_NAME}_data
    restart: "on-failure"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    environment:
      LOG_LEVEL: INFO
      LOG_DIR: /app/logs
    depends_on:
      - fastapi
      - rabbitmq
    networks:
      - app-network

  pushgateway:
    image: prom/pushgateway:latest
    container_name: ${CONTAINER_NAME}_pushgateway
    restart: always
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ${CONTAINER_NAME}_prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_HTTP_PORT: 3000
      GF_LOG_LEVEL: debug
    container_name: ${CONTAINER_NAME}_grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
    container_name: backend_api_nginx
    ports:
      - "127.0.0.1:10443:10443"
    depends_on:
      - fastapi
    networks:
      - app-network
    healthcheck:
      test: >
        sh -c "
          curl -f http://fastapi:8000/health/ &&
          curl -f -L http://grafana:3000/grafana/ || exit 1
        "
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${CONTAINER_NAME}_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_MANAGEMENT_PATH_PREFIX=/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: DataGathering/Dockerfile
    container_name: ${CONTAINER_NAME}_worker
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      fastapi:
        condition: service_started
    environment:
      - PYTHONPATH=/app
    networks:
      - app-network
    command: [ "python", "/app/DataGathering/worker.py" ]


volumes:
  postgres_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
